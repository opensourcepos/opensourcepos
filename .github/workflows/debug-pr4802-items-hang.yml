name: Debug PR4802 Items Hang

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-items:
    name: PHP 8.3 / mariadb:10.11 ItemsControllerTest
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli
          coverage: none

      - name: Start database
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ospos_test \
            -e MYSQL_USER=admin \
            -e MYSQL_PASSWORD=pointofsale \
            -p 3306:3306 \
            mariadb:10.11
          retries=0
          until docker exec mysql mysqladmin ping -h 127.0.0.1 -u root -proot --silent; do
            retries=$((retries + 1))
            if [ $retries -ge 60 ]; then
              echo "Database failed to start after 60 attempts"
              exit 1
            fi
            echo "Waiting for database... (attempt $retries/60)"
            sleep 2
          done
          echo "Database is ready!"

          docker exec mysql mysql -u root -proot \
            --execute="GRANT CREATE, DROP ON ospos_test.* TO 'admin'@'%'; FLUSH PRIVILEGES;"

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-8.3-
            ${{ runner.os }}-

      - name: Install dependencies
        run: composer update --ansi --no-interaction

      - name: Create .env file
        run: cp .env.example .env

      - name: Provision per-run encryption key
        run: |
          KEY=$(openssl rand -hex 32)
          printf 'ENCRYPTION_KEY=%s\n' "$KEY" >> "$GITHUB_ENV"

      - name: Provision per-run throttle key
        run: |
          KEY=$(openssl rand -hex 32)
          sed -i "s/^throttle\.key=''/throttle.key='$KEY'/" .env
          grep -Eq "^throttle\.key=.+" .env

      - name: Run ItemsControllerTest with progress log
        env:
          CI_ENVIRONMENT: testing
          MYSQL_HOST_NAME: 127.0.0.1
        timeout-minutes: 6
        run: |
          set +e
          mkdir -p debug-items
          vendor/bin/phpunit \
            --no-coverage \
            --display-deprecations \
            --display-notices \
            --display-warnings \
            --log-junit debug-items/junit.xml \
            --filter 'ItemsControllerTest' 2>&1 | tee debug-items/phpunit.log
          status=${PIPESTATUS[0]}
          echo "PHPUnit exit status: $status"
          exit "$status"

      - name: Upload debug results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pr4802-items-hang
          path: debug-items/
          retention-days: 7

      - name: Stop database
        if: always()
        run: docker stop mysql && docker rm mysql